spring.application.name=react_reply
server.port=8090

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/react_reply
spring.datasource.username=testuser
spring.datasource.password=test1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

spring.banner.charset=UTF-8
spring.main.banner-mode=console
spring.output.ansi.enabled=ALWAYS

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.location=D:\\file_repo
spring.servlet.multipart.max-request-size=30MB

com.gorani.upload.path=D:\\file_repo

logging.level.org.springframework.security.web=trace
logging.level.org.gorani=debug