        .container {

        .item {
            width: 200px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            border: 1px solid blue;
        }

        .item:nth-child(2n+1) {

        }

        .item:nth-child(2n) {

        }

        #opt1 {

        #opt2 {

        }

        #opt3 {

        }

        #opt4 {

        }
        #opt5 {
            flex-flow: row nowrap;
        }
    </style>
</head>
