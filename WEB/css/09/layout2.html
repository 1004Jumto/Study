<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .wrapper {
            width: 1000px; 
            margin: 0 auto; 
            background-color: #444040;
            text-align: center;
            color: aliceblue; 
            border: 3px solid rgb(3, 3, 3); 
        }
        header {
            padding: 40px 0px; 
            border: 3px solid rgb(3, 3, 3); 
        }
        nav { 
            border: 3px solid rgb(3, 3, 3); 
            height: 40px;
        }
        nav > ul {
            margin: 0;
            padding: 0;
        }
        nav > ul > li {
            list-style-type: none; 
            border: 3px solid rgb(3, 3, 3); 
            width: 25%;
            height: 40px;
            float: left;
        }
        main { 
            border: 3px solid rgb(3, 3, 3); 
            padding: 100px 0px;
        }
        footer { 
            border: 3px solid rgb(3, 3, 3); 
            padding: 30px 0px;
        }
    </style>
</head>
<body>
    <div class="wrapper"> 
        <header>header</header> 
        <nav> 
            <ul>
                <li>menu1</li>
                <li>menu2</li>
                <li>menu3</li>
                <li>menu4</li>
            </ul>
        </nav>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
