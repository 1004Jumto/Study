<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        #box {
            width: 100px;
            height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid black;
            background-color: orange;
        }
    </style>
    <script>
        $(function () {
            $('#hide').click(function () {
                // alert(1);
                $('#box').hide();
            });
            $('#show').click(function () {
                // alert(1);
                $('#box').show();
            });

            let flag = true;
            $('#toggle').click(function () {
                // alert(1);
                if (flag) {
                    $('#box').hide();
                    flag = false;
                }
                else {
                    $('#box').show();
                    flag = true;
                }
            });

            $('#slide').click(function () {
                $('#box').slideToggle(3000, function () {
                    console.log('실행끝');
                });
                $('#box').fadeIn();
                $('#box').fadeOut();
            });


        });
    </script>
</head>

<body>
    <button id="show">button보이기</button>
    <button id="hide">button숨기기</button>
    <button id="toggle">button토글</button>
    <button id="slide">button슬라이드</button>
    <hr>
    <div id="box">box</div>
</body>

</html>
