<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        #box {
            width: 100px;
            height: 100px;

            display: flex;
            position: relative;
            justify-content: center;
            align-items: center;

            border: 1px solid black;
            background-color: orange;
        }
    </style>
    <script>
        $(function () {
            $('#move').click(function () {
                // alert(1);
                
                setInterval(function(){
                    $('#box').animate({
                        left: 300
                    }, 1000).animate({
                        top: 300
                    }, 1000).animate({
                        top: 0,
                        left:0
                    }, 1000);
                    
                }, 3000)
            });



        });
    </script>
</head>

<body>
    <button id="show">button보이기</button>
    <button id="move">이동</button>
    <button id="toggle">button토글</button>
    <button id="slide">button슬라이드</button>
    <hr>
    <div id="box">box</div>
</body>

</html>
